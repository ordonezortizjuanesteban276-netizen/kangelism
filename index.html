if(n%4==0)this.note(f(r-24),t,this.sl*3.6,'triangle',.5);
if(n%2==0&&h%5||h%7==0)this.note(f(r+s[(h>>>3)%s.length]+((h>>>8&1)?12:0)),t,this.sl*2.2,T.wave,.1);
if(n%32==0)[0,2,4].forEach(d=>this.note(f(r+s[d%s.length]),t,this.sl*30,'sine',.05))},
note(f,t,d,w,v){const c=this.c,o=c.createOscillator(),g=c.createGain();o.type=w;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(this.bus);o.start(t);o.stop(t+d+.05)},
kick(t){const c=this.c,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(this.bus);o.start(t);o.stop(t+.25)},
hat(t){const c=this.c,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=this.nb;f.type='highpass';f.frequency.value=7500;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);s.connect(f);f.connect(g);g.connect(this.bus);s.start(t)}};

/* ---- UI builders ---- */
const art=(h,s,r=6)=>`<div class="art" style="--h:${h};width:${s};height:${s=='100%'?'auto':s};border-radius:${typeof r=='number'?r+'px':r}"></div>`;
const cd=(h,t,s,a,i,pa,pi,r)=>`<div class="card" data-a="${a}" data-i="${i}"><div class="cv">${art(h,'100%',r?'50%':8)}<button class="pb" data-a="${pa}" data-i="${pi}" title="Play">${ic('play',20,1)}</button></div><b>${esc(t)}</b><small>${esc(s)}</small></div>`;
const alC=a=>cd(a.h,a.t,ARM[a.ar].n,'go','album-'+a.id,'pc','al:'+a.id);
const arC=a=>cd(a.h,a.n,'Artist','go','artist-'+a.id,'pc','ar:'+a.id,1);
const trC=t=>cd(t.h,t.t,ARM[t.ar].n,'pt',t.id+'|all','pt',t.id+'|all');
const plC=p=>cd(hP(p.id),p.n,p.t.length+' songs','go','playlist-'+p.id,'pc','pl:'+p.id);
const gt=g=>`<div class="gt" style="--h:${g.h}" data-a="gn" data-i="${g.n}">${g.n}${art(g.h,'72px',8)}</div>`;
const sec=(t,h,x='row')=>`<section><h2>${t}</h2><div class="${x}">${h}</div></section>`;
const rows=(l,c,rm)=>l.length?`<div class="tl">${l.map((t,i)=>{const k=S.liked.includes(t.id);return `<div class="tr${cur&&cur.id==t.id?' on':''}" data-a="pt" data-i="${t.id}|${c}"><span class="n">${i+1}</span><span class="pi">${ic('play',14,1)}</span><div class="ti">${art(t.h,'40px')}<div><b>${esc(t.t)}</b><small>${esc(ARM[t.ar].n)}</small></div></div><span class="al">${esc(AM[t.al].t)}</span><div class="ac"><button class="${k?'lkd':''}" data-a="lk" data-i="${t.id}" title="Like">${ic('heart',17,k)}</button><button data-a="qa" data-i="${t.id}" title="Add to queue">${ic('queue',17)}</button><button data-a="pl" data-i="${t.id}" title="Add to playlist">${ic('plus',17)}</button>${rm?`<button data-a="rm" data-i="${rm}|${t.id}" title="Remove">${ic('x',17)}</button>`:''}</div><span class="du">${fm(t.dur)}</span></div>`}).join('')}</div>`:'<p class="em">No songs here yet.</p>';
const hero=(h,ty,t,s,r)=>`<div class="hero">${art(h,'min(200px,38vw)',r?'50%':10)}<div><small>${ty}</small><h1>${esc(t)}</h1><p>${s}</p></div></div>`;
const bar=(c,x)=>`<div class="bar"><button class="big" data-a="pc" data-i="${c}" title="Play">${ic('play',24,1)}</button>${x}</div>`;
const lnk=a=>`<span class="lnk" data-a="go" data-i="artist-${a}">${esc(ARM[a].n)}</span>`;
const sf=()=>{const s=q.toLowerCase().trim();return s?TR.filter(t=>(t.t+' '+ARM[t.ar].n+' '+AM[t.al].t+' '+t.g).toLowerCase().includes(s)):[]};
function res(){if(!q.trim())return sec('Browse all',GN.map(gt).join(''),'gd');const s=q.toLowerCase(),t=sf(),al=ALB.filter(a=>(a.t+ARM[a.ar].n+a.g).toLowerCase().includes(s)),ar=AR.filter(a=>a.n.toLowerCase().includes(s));
if(!t.length&&!al.length&&!ar.length)return `<p class="em">No results for “${esc(q)}”. Check the spelling or try another artist, song, or genre.</p>`;
return(t.length?`<section><h2>Songs</h2>${rows(t,'s')}</section>`:'')+(ar.length?sec('Artists',ar.map(arC).join('')):'')+(al.length?sec('Albums',al.map(alC).join('')):'')}
const newest=()=>[...ALB].sort((a,b)=>b.y-a.y);
const VW={
home(){tint=150;const g=new Date().getHours(),d=new Date().getDate(),rc=S.recent.map(i=>TM[i]);
const qk=[{t:'Liked Songs',h:140,go:'liked',pc:'liked'},...S.pls.slice(0,3).map(p=>({t:p.n,h:hP(p.id),go:'playlist-'+p.id,pc:'pl:'+p.id})),...ALB.map(a=>({t:a.t,h:a.h,go:'album-'+a.id,pc:'al:'+a.id}))].slice(0,6);
return `<h1 class="gr">${g<12?'Good morning':g<19?'Good afternoon':'Good evening'}</h1><div class="grid">${qk.map(x=>`<div class="qk" data-a="go" data-i="${x.go}">${art(x.h,'56px',0)}<b>${esc(x.t)}</b><button class="pb" data-a="pc" data-i="${x.pc}" title="Play">${ic('play',18,1)}</button></div>`).join('')}</div>`
+sec(rc.length?'Recently played':'Jump back in',(rc.length?rc:TR).slice(0,10).map(trC).join(''))
+sec('Recommended for you',[...TR].sort((a,b)=>hs(a.seed+d)-hs(b.seed+d)).slice(0,8).map(trC).join(''))
+sec('Popular albums',ALB.map(alC).join(''))+sec('Featured artists',AR.map(arC).join(''))
+sec('New releases',newest().slice(0,4).map(alC).join(''))+sec('Discover by genre',GN.map(gt).join(''),'gd')},
explore(){tint=215;return `<h1 class="gr">Explore</h1>`+sec('Browse genres',GN.map(gt).join(''),'gd')+sec('New releases',newest().map(alC).join(''))+`<section><h2>All songs</h2>${rows(TR,'all')}</section>`},
search(){tint=190;return `<h1 class="gr">Search</h1><div id="res">${res()}</div>`},
library(){tint=260;const c=lt=='pl'?cd(140,'Liked Songs',S.liked.length+' songs','go','liked','pc','liked')+S.pls.map(plC).join(''):lt=='al'?(S.al.length?S.al.map(i=>alC(AM[i])).join(''):'<p class="em">Save albums with the heart on an album page.</p>'):(S.ar.length?S.ar.map(i=>arC(ARM[i])).join(''):'<p class="em">Follow artists from their page.</p>');
return `<h1 class="gr">Your Library</h1><div class="chips">${[['pl','Playlists'],['al','Albums'],['ar','Artists']].map(([k,n])=>`<button class="chip${lt==k?' on':''}" data-a="lt" data-i="${k}">${n}</button>`).join('')}<button class="chip" data-a="np">${ic('plus',16)}New playlist</button></div><div class="gd">${c}</div>`},
liked(){tint=140;return hero(140,'Playlist','Liked Songs',S.liked.length+' songs')+bar('liked','')+(S.liked.length?rows(S.liked.map(i=>TM[i]),'liked'):'<p class="em">Tap the heart on any song to save it here.</p>')},
album(){const a=AM[arg],l=TR.filter(t=>t.al==a.id),sv=S.al.includes(a.id);tint=a.h;return hero(a.h,'Album',a.t,`By ${lnk(a.ar)}, ${a.y}, ${l.length} songs`)+bar('al:'+a.id,`<button class="ib${sv?' on':''}" data-a="sa" data-i="${a.id}" title="Save album">${ic('heart',28,sv)}</button>`)+rows(l,'al:'+a.id)},
artist(){const a=ARM[arg],l=TR.filter(t=>t.ar==a.id),f=S.ar.includes(a.id);tint=a.h;return hero(a.h,'Artist',a.n,l.length+' songs',1)+bar('ar:'+a.id,`<button class="chip${f?' on':''}" data-a="fa" data-i="${a.id}">${f?'Following':'Follow'}</button>`)+`<section><h2>Popular</h2>${rows(l,'ar:'+a.id)}</section>`+sec('Albums',ALB.filter(x=>x.ar==a.id).map(alC).join(''))},
playlist(){const p=S.pls.find(x=>x.id==arg);tint=hP(p.id);return hero(tint,'Playlist',p.n,p.t.length+' songs')+bar('pl:'+p.id,`<button class="ib" data-a="dp" data-i="${p.id}" title="Delete playlist">${ic('trash',24)}</button>`)+(p.t.length?rows(p.t.map(i=>TM[i]),'pl:'+p.id,p.id):'<p class="em">This playlist is empty. Use the plus button on any song to add it.</p>')}};
function sbr(){const o=v=>H==v?' on':'';
const li=(go,t,s,h,r)=>`<div class="li${o(go)}" data-a="go" data-i="${go}">${art(h,'44px',r?'50%':6)}<div><b>${esc(t)}</b><small>${s}</small></div></div>`;
$('#sb').innerHTML=`<div class="pn"><div class="logo"><span class="mk">${LG}</span><span class="wm">KANGEL<i>I</i>SM</span></div>${[['home','Home','home'],['explore','Explore','compass'],['search','Search','search']].map(([v,t,i])=>`<button class="nv${o(v)}" data-a="go" data-i="${v}">${ic(i,22)}${t}</button>`).join('')}</div>
<div class="pn lb"><div class="lh"><button class="nv${o('library')}" data-a="go" data-i="library" style="padding:0;width:auto">${ic('library',22)}Your Library</button><button class="ib" data-a="np" title="Create playlist">${ic('plus')}</button></div><button class="cp" data-a="np">Create playlist</button>
<small class="sh">Playlists</small>${li('liked','Liked Songs',S.liked.length+' songs',140)}${S.pls.map(p=>li('playlist-'+p.id,p.n,p.t.length+' songs',hP(p.id))).join('')}
<small class="sh">Saved albums</small>${S.al.length?S.al.map(i=>li('album-'+i,AM[i].t,ARM[AM[i].ar].n,AM[i].h)).join(''):'<p class="em">Heart an album to save it.</p>'}
<small class="sh">Favorite artists</small>${S.ar.length?S.ar.map(i=>li('artist-'+i,ARM[i].n,'Artist',ARM[i].h,1)).join(''):'<p class="em">Follow an artist to see them here.</p>'}</div>`;
$('#tb').innerHTML=[['home','Home','home'],['search','Search','search'],['library','Library','library']].map(([v,t,i])=>`<button class="${view==v?'on':''}" data-a="go" data-i="${v}">${ic(i,22)}${t}</button>`).join('')+`<button data-a="tq">${ic('queue',22)}Queue</button>`}
function render(){const y=M.scrollTop;sbr();V.innerHTML=VW[view]();M.style.setProperty('--t',`hsl(${tint} 45% 26%)`);M.scrollTop=y;if(qo)qv()}
function route(){H=location.hash.slice(1)||'home';[view,arg]=H.split('-');
if(!VW[view]||(view=='album'&&!AM[arg])||(view=='artist'&&!ARM[arg])||(view=='playlist'&&!S.pls.find(p=>p.id==arg))){view='home';arg='';H='home'}
V.classList.remove('fx');void V.offsetWidth;V.classList.add('fx');M.scrollTop=0;render();if(view=='search')$('#q').focus()}

/* ---- Player ---- */
function ctxT(c){const[k,i]=c.split(':');return k=='all'?TR:k=='al'?TR.filter(t=>t.al==i):k=='ar'?TR.filter(t=>t.ar==i):k=='pl'?(S.pls.find(p=>p.id==i)||{t:[]}).t.map(x=>TM[x]):k=='liked'?S.liked.map(x=>TM[x]):k=='s'?sf():[]}
function load(id,off=0){cur=TM[id];S.recent=[id,...S.recent.filter(x=>x!=id)].slice(0,24);save();Eng.start(cur,off);document.title=cur.t+' – ANDREINI';updP();render()}
function playT(id,c){Q=(c?ctxT(c):[TM[id]]).map(t=>t.id);qi=Q.indexOf(id);if(qi<0){Q=[id];qi=0}load(id)}
function playC(c){const l=ctxT(c);if(!l.length)return toast('Add a song first');Q=l.map(t=>t.id);qi=S.shuf?Math.random()*Q.length|0:0;load(Q[qi])}
function tog(){if(!cur)return playC('all');Eng.on?Eng.stop():Eng.start(cur,Eng.pos);updP()}
function nx(a){if(!Q.length)return;if(a&&S.rep==2)return load(cur.id);let n=qi+1;if(S.shuf&&Q.length>1)do n=Math.random()*Q.length|0;while(n==qi);if(n>=Q.length){if(a&&!S.rep){updP();ui();return}n=0}qi=n;load(Q[qi])}
function pv(){if(!cur)return;if(Eng.get()>3||Q.length<2)return seek(0);qi=qi>0?qi-1:S.rep?Q.length-1:0;load(Q[qi])}
function seek(r){if(!cur)return;const t=r*cur.dur;Eng.on?Eng.start(cur,t):Eng.pos=t;ui()}
function ui(){if(!cur)return;const p=Eng.get();if(!drag){$('#pf').style.width=Math.min(100,p/cur.dur*100)+'%';$('#tc').textContent=fm(p)}}
function updP(){const k=cur&&S.liked.includes(cur.id);$('#lt').innerHTML=cur?`${art(cur.h,'56px')}<div class="mt"><b>${esc(cur.t)}</b><small>${esc(ARM[cur.ar].n)}</small></div><button class="ib${k?' lkd':''}" data-a="lkc" title="Like">${ic('heart',18,k)}</button>`:'<small>Choose a song to start listening</small>';
$('#pp').innerHTML=ic(Eng.on?'pause':'play',18,1);$('#sh').classList.toggle('on',!!S.shuf);const r=$('#rp');r.classList.toggle('on',S.rep>0);r.innerHTML=ic(S.rep==2?'rep1':'repeat',18);$('#td').textContent=cur?fm(cur.dur):'0:00'}
function setVol(v){S.vol=v;Eng.m&&(Eng.m.gain.value=v);$('#vf').style.width=v*100+'%';$('#vi').innerHTML=ic(v?'vol':'mute');save()}
const lk=id=>{const i=S.liked.indexOf(id);i<0?S.liked.unshift(id):S.liked.splice(i,1);save();toast(i<0?'Added to Liked Songs':'Removed from Liked Songs');updP();render()};
const qrow=(id,i,rm)=>{const t=TM[id];return `<div class="qr" data-a="qj" data-i="${i}">${art(t.h,'40px')}<div><b>${esc(t.t)}</b><small>${esc(ARM[t.ar].n)}</small></div>${rm?`<button class="ib" data-a="qr" data-i="${i}" title="Remove">${ic('x',16)}</button>`:''}</div>`};
function qv(){const n=Q.slice(qi+1);$('#qp').innerHTML=`<div class="qh"><h3>Queue</h3>${n.length?'<button class="bn s" data-a="qc">Clear</button>':''}<button class="ib" data-a="tq" title="Close">${ic('x')}</button></div>${cur?`<small>Now playing</small>${qrow(cur.id,qi,0)}`:''}<small>Next up</small>${n.length?n.map((id,j)=>qrow(id,qi+1+j,1)).join(''):'<p class="em">Nothing queued. Use the queue button on any song.</p>'}`}
const modal=h=>{$('#md').innerHTML=`<div class="mc">${h}</div>`;$('#md').classList.add('o');setTimeout(()=>{const p=$('#pn');p&&p.focus()},30)},cm=()=>$('#md').classList.remove('o');
const plm=id=>modal(`<h3>Add to playlist</h3>${S.pls.map(p=>`<div class="mi" data-a="tg" data-i="${p.id}|${id}">${esc(p.n)}${p.t.includes(id)?ic('check'):''}</div>`).join('')}<div class="mi" data-a="np" data-i="${id}">${ic('plus')}New playlist</div>`);
const toast=m=>{const t=$('#ts');t.textContent=m;t.classList.add('o');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('o'),1800)};

/* ---- Actions ---- */
const A={go:i=>{location.hash=i},pc:playC,pt:i=>{const[a,b]=i.split('|');playT(a,b)},lk,lkc:()=>cur&&lk(cur.id),pl:plm,
qa:i=>{if(!cur)return playT(i);Q.splice(qi+1,0,i);toast('Added to queue');render()},
qr:i=>{i=+i;Q.splice(i,1);if(i<qi)qi--;render()},qj:i=>{qi=+i;load(Q[qi])},qc:()=>{Q.length=cur?qi+1:0;render()},
tq:()=>{qo=!qo;$('#qp').classList.toggle('o',qo);qv()},
rm:i=>{const[p,t]=i.split('|'),P=S.pls.find(x=>x.id==p);P.t=P.t.filter(x=>x!=t);save();render()},
np:i=>modal(`<h3>Name your playlist</h3><input id="pn" maxlength="40" placeholder="My playlist" autocomplete="off"><div class="ft"><button class="bn s" data-a="cm">Cancel</button><button class="bn" data-a="mk" data-i="${i||''}">Create</button></div>`),
mk:i=>{const p={id:'p'+Date.now().toString(36),n:$('#pn').value.trim()||'My playlist #'+(S.pls.length+1),t:i?[i]:[]};S.pls.push(p);save();cm();toast(i?'Added to '+p.n:'Playlist created');i?render():location.hash='playlist-'+p.id},
tg:i=>{const[p,t]=i.split('|'),P=S.pls.find(x=>x.id==p);tgl(P.t,t);plm(t);render()},
sa:i=>{tgl(S.al,i);render()},fa:i=>{tgl(S.ar,i);render()},
lt:i=>{lt=i;render()},lbt:i=>{lt=i;view=='library'?render():location.hash='library'},
gn:i=>{q=i;$('#q').value=i;view=='search'?V.querySelector('#res').innerHTML=res():location.hash='search'},
dp:i=>modal(`<h3>Delete this playlist?</h3><p class="em">This can’t be undone.</p><div class="ft"><button class="bn s" data-a="cm">Cancel</button><button class="bn" data-a="dy" data-i="${i}">Delete</button></div>`),
dy:i=>{S.pls=S.pls.filter(p=>p.id!=i);save();cm();location.hash='library'},
cm,pp:tog,nx:()=>nx(0),pv,sh:()=>{S.shuf^=1;save();updP()},rp:()=>{S.rep=(S.rep+1)%3;save();updP()},
vm:()=>{if(S.vol>0){lastV=S.vol;setVol(0)}else setVol(lastV||.7)},bk:()=>history.back(),fw:()=>history.forward()};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||(el.id=='md'&&e.target!=el))return;A[el.dataset.a](el.dataset.i)});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='pn')return document.querySelector('[data-a=mk]').click();if(e.code=='Space'&&!/INPUT|BUTTON/.test(e.target.tagName)){e.preventDefault();tog()}});
function sl(el,mv,up){let d=0;const r=e=>Math.min(1,Math.max(0,(e.clientX-el.getBoundingClientRect().left)/el.offsetWidth));el.onpointerdown=e=>{d=1;el.setPointerCapture(e.pointerId);mv(r(e))};el.onpointermove=e=>d&&mv(r(e));el.onpointerup=e=>{if(d){d=0;up(r(e))}}}

/* ---- Init ---- */
document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=ic(e.dataset.ic,+e.dataset.s||18,e.dataset.f));
$('#q').oninput=e=>{q=e.target.value;view=='search'?$('#res').innerHTML=res():location.hash='search'};
M.onscroll=()=>$('#top').classList.toggle('sc',M.scrollTop>20);
sl($('#pb'),r=>{drag=1;if(cur){$('#pf').style.width=r*100+'%';$('#tc').textContent=fm(r*cur.dur)}},r=>{drag=0;seek(r)});
sl($('#vb'),setVol,setVol);
Eng.end=()=>nx(1);
setInterval(()=>{Eng.tick();ui()},80);
setVol(S.vol);updP();route();addEventListener('hashchange',route);
</script>
</body>
